# Daily FX paper trading on GitHub's servers: the trend account (paper/) and the
# learning-model account (paper_ml/), each optionally mirrored onto an OANDA PRACTICE
# (demo) account. The OANDA client can only reach the practice server: no real orders.
name: Daily FX paper trading

on:
  schedule:
    - cron: "30 0 * * 1-5"     # 00:30 UTC Mon-Fri, while FX is open: Monday acts on Friday's close
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also re-run the full backtest (results/BACKTEST.md)"
        type: boolean
        default: false

permissions:
  contents: write              # to commit paper/ (and results/)

concurrency:
  group: fx-paper-trading
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      HAS_OANDA: ${{ secrets.OANDA_API_TOKEN != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Paper run
        run: |
          python -m fxbot paper run
          python -m fxbot paper report > /dev/null
          python -m fxbot paper status
      - name: Learning-model paper run (retrains weekly after the Friday close)
        continue-on-error: true      # a model/data hiccup must not block the trend account's commit
        run: |
          mkdir -p paper_ml
          set -o pipefail
          # keep the output in the repo: a failure here is visible without opening the Actions logs
          { python -m fxbot ml run && python -m fxbot ml report > /dev/null && python -m fxbot ml status; } \
            2>&1 | tee paper_ml/last_run.log
      - name: OANDA practice accounts (demo money, real broker prices)
        if: ${{ env.HAS_OANDA == 'true' }}
        continue-on-error: true
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_TREND: ${{ secrets.OANDA_ACCOUNT_TREND }}
          OANDA_ACCOUNT_ML: ${{ secrets.OANDA_ACCOUNT_ML }}
        run: |
          mkdir -p practice_trend practice_ml
          python -m fxbot practice check 2>&1 | tee practice_check.log
          python -m fxbot practice run --strategy trend 2>&1 | tee practice_trend/last_run.log
          python -m fxbot practice run --strategy ml 2>&1 | tee practice_ml/last_run.log
      - name: Backtest
        if: ${{ inputs.backtest }}
        run: python -m fxbot backtest
      - name: Commit and push results
        run: |
          git config user.name "fxbot (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper paper_ml results
          git add practice_trend practice_ml practice_check.log 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Paper trading run $(date -u +%F)"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((i * 5)); git pull --rebase origin main
          done
          exit 1

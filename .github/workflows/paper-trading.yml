# Daily FX paper trading on GitHub's servers. Simulated money only: there is no broker
# connection in this repo, so this workflow cannot place real orders.
name: Daily FX paper trading

on:
  schedule:
    - cron: "30 0 * * 2-6"     # 00:30 UTC Tue-Sat: acts on the Mon-Fri daily closes
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also re-run the full backtest (results/BACKTEST.md)"
        type: boolean
        default: false

permissions:
  contents: write              # to commit paper/ (and results/)

concurrency:
  group: fx-paper-trading
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Paper run
        run: |
          python -m fxbot paper run
          python -m fxbot paper report > /dev/null
          python -m fxbot paper status
      - name: Backtest
        if: ${{ inputs.backtest }}
        run: python -m fxbot backtest
      - name: Commit and push results
        run: |
          git config user.name "fxbot (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper results
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Paper trading run $(date -u +%F)"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((i * 5)); git pull --rebase origin main
          done
          exit 1
